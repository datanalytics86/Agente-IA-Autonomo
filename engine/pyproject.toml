[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agencia-engine"
version = "0.1.0"
description = "Núcleo, configuración y persistencia del agente de agencia"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "jinja2>=3.1",
    "holidays>=0.57",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "time-machine",
    "ruff",
    "mypy",
    "pip-audit",
]

[tool.setuptools]
packages = [
    "core",
    "db",
    "integrations",
    "integrations.email",
    "integrations.booking",
    "integrations.payments",
    "integrations.meta",
    "integrations.hosting",
    "integrations.storage",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "integrations"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "."
namespace_packages = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["core", "core.*", "db", "db.*"]
strict = true

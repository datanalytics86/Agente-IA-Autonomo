title = "Agente IA Autonomo"

[extend]
useDefault = true

# Un solo hallazgo histórico. El archivo ya no está en el árbol.
# conditions dentro del allowlist se evalúan en AND: ruta, commit y secreto.
[[allowlists]]
description = "infra/.env.ci en 589a37a: SECRET_KEY de prueba, no es una credencial"
paths = ['''(^|/)infra/\.env\.ci$''']
commits = ["589a37a09e43ab997999e543eab044fadb11a929"]
regexes = ['''ci-secret-key-de-prueba-no-es-prod-32''']

[[allowlists]]
description = "test_payments.py: x_signature vacío de un test (ec401614 y el árbol actual). No es una credencial."
paths = ['''(^|/)engine/tests/test_payments\.py$''']
regexes = ['''x_signature=''']

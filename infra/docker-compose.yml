# Demo y CI. Sin envíos: el .env de prueba deja APP_MODE=demo y DRY_RUN=true.
# Sustitución de ${VAR}: `docker compose --env-file infra/.env.ci` si no hay
# un .env en la raíz. Dentro de api/worker/migrate, env_file lee ../.env y,
# si no existe, infra/.env.ci (el de abajo gana).
# DATABASE_URL del contenedor siempre usa el driver psycopg hacia el servicio db.
# Una clave con @ : / o # hay que pasarla ya codificada: se interpola tal cual.

name: agencia

x-engine-build: &engine-build
  context: ..
  dockerfile: infra/Dockerfile.engine

x-env-file: &env-file
  - path: .env.ci
    required: false
  - path: ../.env
    required: false

x-engine-environment: &engine-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agencia}:${POSTGRES_PASSWORD:-agencia}@db:5432/${POSTGRES_DB:-agencia}
  CLIENT_SITES_DIR: /data/client_sites

x-engine-volumes: &engine-volumes
  - artifacts:/app/output
  - client_sites:/data/client_sites

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agencia}
      POSTGRES_DB: ${POSTGRES_DB:-agencia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: *engine-build
    env_file: *env-file
    environment: *engine-environment
    command: ["python", "migrate_entry.py"]
    volumes: *engine-volumes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/migrated').is_file() else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  api:
    build: *engine-build
    env_file: *env-file
    environment: *engine-environment
    command: ["python", "main.py", "--mode", "api"]
    volumes: *engine-volumes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_healthy
    expose:
      - "8000"
    init: true
    restart: unless-stopped

  worker:
    build: *engine-build
    env_file: *env-file
    environment: *engine-environment
    command: ["python", "worker_entry.py"]
    volumes: *engine-volumes
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_healthy
    # La imagen chequea /healthz. El worker no sirve HTTP: este check
    # pasa cuando worker_entry ya dejó /tmp/worker-ready.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if pathlib.Path('/tmp/worker-ready').is_file() else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s
    init: true
    restart: unless-stopped

  caddy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.front
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    # La imagen no trae healthcheck. Este pide /healthz por el proxy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    volumes:
      - client_sites:/srv/clients
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backup:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-agencia}
      PGPASSWORD: ${POSTGRES_PASSWORD:-agencia}
      PGDATABASE: ${POSTGRES_DB:-agencia}
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
  client_sites:
  caddy_data:
  caddy_config:
  backups:

# Override de producción. Junto al compose base:
#   IMAGE_TAG=... POSTGRES_PASSWORD=... APP_MODE=... PUBLIC_BASE_URL=... \
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# POSTGRES_PASSWORD tiene que ser hexadecimal, sin @, : ni /.
# DATABASE_URL no la codifica: un carácter de esos parte la URL.
# engine_output persiste landings y sitios. En la imagen el motor está en /app.
# CLIENT_SITES_DIR queda absoluto porque el default relativo cae fuera de /app.
# Caddy ve el volumen en /srv/output, solo lectura.

x-logging: &json-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: !reset []
    restart: unless-stopped
    logging: *json-logs

  api:
    build: !reset null
    image: ghcr.io/datanalytics86/agente-ia-autonomo-engine:${IMAGE_TAG:?}
    environment:
      APP_MODE: ${APP_MODE:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      AGENCY_OUTPUT_DIR: /app/output
      CLIENT_SITES_DIR: /app/output/clients
      DATABASE_URL: postgresql://agencia:${POSTGRES_PASSWORD:?}@db:5432/agencia
    env_file:
      - path: ${AGENCIA_ENV_FILE:-/opt/agencia/.env}
        required: true
    volumes:
      - engine_output:/app/output
    restart: unless-stopped
    logging: *json-logs

  worker:
    build: !reset null
    image: ghcr.io/datanalytics86/agente-ia-autonomo-engine:${IMAGE_TAG:?}
    environment:
      APP_MODE: ${APP_MODE:?}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      AGENCY_OUTPUT_DIR: /app/output
      CLIENT_SITES_DIR: /app/output/clients
      DATABASE_URL: postgresql://agencia:${POSTGRES_PASSWORD:?}@db:5432/agencia
    env_file:
      - path: ${AGENCIA_ENV_FILE:-/opt/agencia/.env}
        required: true
    volumes:
      - engine_output:/app/output
    restart: unless-stopped
    logging: *json-logs

  caddy:
    volumes:
      - engine_output:/srv/output:ro
    restart: unless-stopped
    logging: *json-logs

  backup:
    image: postgres:16
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-agencia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-agencia}
      ENGINE_OUTPUT_DIR: /engine-output
      BACKUP_DIR: /backups
    volumes:
      - engine_output:/engine-output:ro
      - ./scripts/backup.sh:/opt/backup.sh:ro
      - backups:/backups
    entrypoint: ["bash", "/opt/backup.sh", "/backups"]
    restart: "no"
    logging: *json-logs

volumes:
  engine_output:
    name: engine_output
  backups:

# Override de producción. Junto al compose base:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# engine_output persiste landings, storyboards y sitios de cliente.
# El perfil backup monta ese volumen y lo archiva junto al dump de Postgres.

services:
  api:
    environment:
      AGENCY_OUTPUT_DIR: /app/output
    volumes:
      - engine_output:/app/output

  worker:
    environment:
      AGENCY_OUTPUT_DIR: /app/output
    volumes:
      - engine_output:/app/output

  backup:
    image: postgres:16
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-agencia}
      PGPASSWORD: ${POSTGRES_PASSWORD:-agencia}
      PGDATABASE: ${POSTGRES_DB:-agencia}
      ENGINE_OUTPUT_DIR: /engine-output
      BACKUP_DIR: /backups
    volumes:
      - engine_output:/engine-output:ro
      - ./scripts/backup.sh:/opt/backup.sh:ro
      - backups:/backups
    entrypoint: ["bash", "/opt/backup.sh", "/backups"]
    restart: "no"

volumes:
  engine_output:
    name: engine_output
  backups:

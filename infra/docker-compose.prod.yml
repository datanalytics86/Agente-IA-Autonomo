# Override de producción. Junto al compose base:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# engine_output persiste landings, storyboards y sitios de cliente.
# En la imagen el motor vive en /app (agents/runtime.py → /app/output).
# CLIENT_SITES_DIR por defecto es relativo a la raíz del repo; dentro del
# contenedor eso cae fuera de /app, así que aquí queda absoluto y dentro
# del volumen. Caddy lo ve en /srv/output (solo lectura). El perfil backup
# lo archiva con tar junto al dump de Postgres.

services:
  api:
    environment:
      AGENCY_OUTPUT_DIR: /app/output
      CLIENT_SITES_DIR: /app/output/clients
    volumes:
      - engine_output:/app/output

  worker:
    environment:
      AGENCY_OUTPUT_DIR: /app/output
      CLIENT_SITES_DIR: /app/output/clients
    volumes:
      - engine_output:/app/output

  web:
    profiles: ["sin-edge"]

  caddy:
    image: ghcr.io/datanalytics86/agente-ia-autonomo-edge:${IMAGE_TAG:?}
    # !reset deja el campo en cero y pierde la lista. !override reemplaza [api, web].
    depends_on: !override
      - api
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      EDGE_AUTH: ${EDGE_AUTH:-noauth}
      STAGING_USER: ${STAGING_USER:-}
      STAGING_HASH: ${STAGING_HASH:-}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - caddy_data:/data
      - caddy_config:/config
      - engine_output:/srv/output:ro

  backup:
    image: postgres:16
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-agencia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:-agencia}
      ENGINE_OUTPUT_DIR: /engine-output
      BACKUP_DIR: /backups
    volumes:
      - engine_output:/engine-output:ro
      - ./scripts/backup.sh:/opt/backup.sh:ro
      - backups:/backups
    entrypoint: ["bash", "/opt/backup.sh", "/backups"]
    restart: "no"

volumes:
  engine_output:
    name: engine_output
  backups:

# CI. mypy estricto queda en core/db/worker (ADR-013). Sin job de Docker:
# en la máquina de integración no hay binario docker, y el healthcheck
# de Compose no se afirma sin esa evidencia.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependencias
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-dev.txt
          python -m pip install -e ./engine --no-deps

      - name: Lint, tipos, tests o smoke del CLI
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            ruff check .
            ruff format --check .
            mypy .
            # F6-05: tests/test_secret_scan.py entra en esta suite.
            pytest -q --cov=core --cov=agents --cov=worker --cov-fail-under=80
            PYTHONPATH=. python main.py --mode simulate --days 3 --seed 42
          else
            echo "Sin pyproject.toml: no se corre mypy ni ruff sobre agents/."
            PYTHONPATH=. python main.py --mode prompts
            PYTHONPATH=. python -m pytest -q tests/test_smoke_cli.py
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: e2e en Chromium
        run: |
          set -euo pipefail
          cd ../..
          python3 -m venv engine/.venv
          engine/.venv/bin/python -m pip install -r engine/requirements-dev.txt
          engine/.venv/bin/python -m pip install -e ./engine --no-deps
          npm ci --prefix apps/site
          cd apps/web
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Tests solo si el script test existe y no es el placeholder
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const { spawnSync } = require("child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const test = pkg.scripts && pkg.scripts.test;
          if (!test) {
            console.log("apps/web no tiene script test; no se inventa uno.");
            process.exit(0);
          }
          if (String(test).includes("no test specified")) {
            console.log("script test es el placeholder de npm; se omite.");
            process.exit(0);
          }
          const result = spawnSync("npm", ["test"], { stdio: "inherit" });
          process.exit(result.status === null ? 1 : result.status);
          NODE

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('apps/site/package.json') != ''
        with:
          node-version: "22"

      - uses: actions/cache@v4
        if: hashFiles('apps/site/package-lock.json') != ''
        with:
          path: ~/.npm
          key: npm-site-${{ runner.os }}-${{ hashFiles('apps/site/package-lock.json') }}

      - name: Construir el sitio solo si existe el paquete
        run: |
          set -euo pipefail
          if [ ! -f apps/site/package.json ]; then
            echo "apps/site/package.json no existe (lo crea A7). No se construye el sitio."
            exit 0
          fi
          cd apps/site
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm test

  backup-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Volumen engine_output dentro del backup
        run: bash infra/scripts/test-backup-output.sh

  compose-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose de producción exige tag y clave
        run: bash infra/scripts/test-compose-prod.sh

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: python -m pip install pyyaml

      - name: Exigir paths del contrato
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path

          import yaml

          doc = yaml.safe_load(
              Path("docs/contracts/openapi.yaml").read_text(encoding="utf-8")
          )
          paths = (doc or {}).get("paths") or {}
          required = [
              "/healthz",
              "/api/auth/login",
              "/webhooks/mercadopago",
              "/api/public/diagnostico",
          ]
          missing = [item for item in required if item not in paths]
          if missing:
              print("Faltan paths:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          print("openapi ok:", ", ".join(required))
          PY

  deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          set -euo pipefail
          ver=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          echo "${sha}  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      - name: Guard de ALLOW_LIVE
        run: bash infra/scripts/test-deploy-guard.sh

      - name: Layout del release
        run: bash infra/scripts/test-deploy-layout.sh

  agencia-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck y falsos de rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck infra/scripts/agencia-backup infra/scripts/test-agencia-backup.sh
          bash infra/scripts/test-agencia-backup.sh
          sudo visudo -cf infra/sudoers.d/agencia-backup

  bootstrap-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck infra/scripts/bootstrap-host.sh infra/scripts/test-bootstrap-host.sh

      - name: iptables falso
        run: bash infra/scripts/test-bootstrap-host.sh


  caddy-hsts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HSTS en el 443 publicado
        run: bash infra/scripts/test-hsts.sh

  caddy-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Caddy
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz" -o /tmp/caddy.tgz
          tar -xzf /tmp/caddy.tgz -C /tmp caddy
          sudo mv /tmp/caddy /usr/local/bin/caddy

      - name: Paths internos no llegan al proxy
        run: bash infra/scripts/test-caddy-internal.sh

  postgres-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agencia
          POSTGRES_PASSWORD: agencia
          POSTGRES_DB: agencia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agencia -d agencia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Esquema Alembic y semilla demo
        working-directory: engine
        env:
          DATABASE_URL: postgresql+psycopg://agencia:agencia@127.0.0.1:5432/agencia
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m alembic upgrade head
          python main.py --mode seed

      - name: Restore con el cliente de Postgres 16
        run: |
          set -euo pipefail
          docker run --rm --network host --entrypoint bash \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=agencia \
            -e PGPASSWORD=agencia \
            -e PGDATABASE=agencia \
            -v "$PWD:/work" \
            -w /work \
            postgres:16 \
            infra/scripts/ci-restore-probe.sh

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar Caddyfile.prod
        run: |
          set -euo pipefail
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -e SITE_ADDRESS=http://127.0.0.1:8088 \
            -e SITE_DOMAIN=example.test \
            -e PUBLIC_ORIGIN=http://127.0.0.1:8088 \
            -v "$PWD/infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validar Caddyfile.prod con basic auth de staging
        run: |
          set -euo pipefail
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -e SITE_ADDRESS=http://127.0.0.1:8088 \
            -e SITE_DOMAIN=example.test \
            -e PUBLIC_ORIGIN=http://127.0.0.1:8088 \
            -e EDGE_AUTH=staging_auth \
            -e STAGING_USER=ci \
            -e 'STAGING_HASH=$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy' \
            -v "$PWD/infra/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Construir la imagen edge sin publicarla
        run: docker build -f infra/Dockerfile.edge -t agencia-edge:ci .

      - name: Smoke de /, /admin/, /healthz y /readyz
        run: bash infra/scripts/test-edge-smoke.sh

      - name: Caddy no depende de web ni monta el demo
        run: bash infra/scripts/test-edge-compose.sh

      - name: Paths internos en Caddyfile.prod
        run: |
          set -euo pipefail
          if ! command -v caddy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
            sudo apt-get update
            sudo apt-get install -y caddy
          fi
          bash infra/scripts/test-caddy-prod-internal.sh
  gitleaks-allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks 8.30.1
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  gitleaks.tar.gz" | sha256sum -c
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Allowlist AND no tapa otros secretos
        run: bash infra/scripts/test-gitleaks-allowlist.sh

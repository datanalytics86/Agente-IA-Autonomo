# CI. mypy estricto en core/db/worker; agents/api/integrations/simulation en modo normal.
# ADR-013 (excluir esos paquetes) queda reemplazado. Sin inventar compose-smoke.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Instalar dependencias
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f engine/pyproject.toml ]; then
            python -m pip install -e "./engine[dev]"
          else
            python -m pip install -r engine/requirements.txt pytest ruff
          fi

      - name: Lint, tipos, tests o smoke del CLI
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            ruff check .
            ruff format --check .
            mypy .
            # F6-05: tests/test_secret_scan.py entra en esta suite.
            pytest -q --cov=core --cov=agents --cov=worker --cov-fail-under=80
            PYTHONPATH=. python main.py --mode simulate --days 3 --seed 42
          else
            echo "Sin pyproject.toml: no se corre mypy ni ruff sobre agents/."
            PYTHONPATH=. python main.py --mode prompts
            PYTHONPATH=. python -m pytest -q tests/test_smoke_cli.py
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests solo si el script test existe y no es el placeholder
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const { spawnSync } = require("child_process");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const test = pkg.scripts && pkg.scripts.test;
          if (!test) {
            console.log("apps/web no tiene script test; no se inventa uno.");
            process.exit(0);
          }
          if (String(test).includes("no test specified")) {
            console.log("script test es el placeholder de npm; se omite.");
            process.exit(0);
          }
          const result = spawnSync("npm", ["test"], { stdio: "inherit" });
          process.exit(result.status === null ? 1 : result.status);
          NODE

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('apps/site/package.json') != ''
        with:
          node-version: "22"

      - uses: actions/cache@v4
        if: hashFiles('apps/site/package-lock.json') != ''
        with:
          path: ~/.npm
          key: npm-site-${{ runner.os }}-${{ hashFiles('apps/site/package-lock.json') }}

      - name: Construir el sitio solo si existe el paquete
        run: |
          set -euo pipefail
          if [ ! -f apps/site/package.json ]; then
            echo "apps/site/package.json no existe (lo crea A7). No se construye el sitio."
            exit 0
          fi
          cd apps/site
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          npm test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Instalar el motor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"

      - name: Exportar OpenAPI y fallar si difiere del contrato
        working-directory: engine
        run: |
          set -euo pipefail
          PYTHONPATH=. python main.py --mode export-openapi
          git diff --exit-code -- ../docs/contracts/openapi.yaml

  # apps/site no tiene suite Playwright propia. apps/web/e2e levanta el sitio
  # (Astro en :4321) y la API demo. En local Windows el browser es Edge;
  # en ubuntu no hay msedge, así que CI instala y usa el Chromium de Playwright.
  # Los specs no se saltan ni se bajan de severidad.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/site/package-lock.json

      - name: Instalar el motor
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "./engine[dev]"

      - name: Instalar dashboard y sitio
        run: |
          set -euo pipefail
          npm ci --prefix apps/web
          npm ci --prefix apps/site

      - name: Chromium de Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build del dashboard
        working-directory: apps/web
        run: npm run build

      - name: e2e
        working-directory: apps/web
        run: npm run e2e
